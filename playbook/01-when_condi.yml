---
- name: use when condition based install packgege
  hosts: all
  become: yes
  tasks:
    - name: Install httpd package
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "Redhat"

    - name: Install apache2 package
      apt:
        name: apache2
        state: absent
      when: ansible_os_family == "Debian"
     
